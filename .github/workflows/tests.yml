name: tests

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}, Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        filament: ['4', '5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "filament/forms:^${{ matrix.filament }}.0" "filament/support:^${{ matrix.filament }}.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pest
        run: vendor/bin/pest

  js:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Check the committed bundle, stylesheet and locales are built from the sources
        run: |
          npm run build
          git diff --exit-code resources/dist
